<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Validasi Rekening / E-Wallet</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 50px;
            display: flex;
            justify-content: center;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        select, input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            display: none;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Cek Akun & E-Wallet</h2>
        
        <div class="form-group">
            <label for="bankSelect">Pilih Bank / E-Wallet:</label>
            <select id="bankSelect">
                <option value="dana">DANA</option>
                <option value="ovo">OVO</option>
                <option value="bca">BCA</option>
                <option value="mandiri">Mandiri</option>
            </select>
        </div>

        <div class="form-group">
            <label for="accountNumber">Nomor Rekening / No. HP:</label>
            <input type="text" id="accountNumber" placeholder="Masukkan nomor...">
        </div>

        <button onclick="checkAccount()">Cek Rekening</button>

        <div id="resultBox" class="result"></div>
    </div>

    <script>
        // Simulasi database nama pemilik berdasarkan nomor
        const mockDatabase = {
            "dana": {
                "081234567890": "Ahmad Fauzi",
                "089876543210": "Siti Aminah"
            },
            "bca": {
                "1234567890": "Budi Santoso",
                "0987654321": "Dewi Lestari"
            }
        };

        function checkAccount() {
            const bank = document.getElementById('bankSelect').value;
            const accountNumber = document.getElementById('accountNumber').value.trim();
            const resultBox = document.getElementById('resultBox');

            if (!accountNumber) {
                alert('Silakan masukkan nomor terlebih dahulu!');
                return;
            }

            // Simulasi proses pengecekan (bisa diganti dengan fetch() ke API backend Anda)
            const isBankExist = mockDatabase[bank];
            const accountName = isBankExist ? isBankExist[accountNumber] : null;

            resultBox.style.display = 'block';

            if (accountName) {
                // Jika Valid (Nama tercetak)
                resultBox.className = 'result success';
                resultBox.innerHTML = `<strong>Status: Valid</strong><br>Nama Pemilik: <b>${accountName}</b>`;
            } else {
                // Jika Tidak Valid (Tidak mencetak nama / error)
                resultBox.className = 'result error';
                resultBox.innerHTML = `<strong>Status: Tidak Valid</strong><br>Nomor tidak ditemukan atau salah.`;
            }
        }
    </script>

</body>
</html>
