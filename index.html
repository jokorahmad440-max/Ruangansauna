<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi Suhu AC & Login Nama</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 350px;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
        }

        /* Tampilan Form Login */
        .login-box input[type="text"] {
            width: 80%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        .login-box button {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-box button:hover {
            background: #218838;
        }

        /* Area Simulasi */
        .simulation-box {
            display: none; /* Disembunyikan dulu sebelum login */
        }

        .room {
            background: #eef2f3;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            transition: background 0.5s ease;
        }

        .person {
            font-size: 80px;
            margin: 10px 0;
            transition: transform 0.3s ease;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-1px, -2px) rotate(-1deg); }
            40% { transform: translate(-3px, 0px) rotate(1deg); }
            60% { transform: translate(3px, 2px) rotate(0deg); }
            80% { transform: translate(1px, -1px) rotate(1deg); }
            100% { transform: translate(-1px, 2px) rotate(-1deg); }
        }

        .shivering {
            animation: shake 0.2s infinite;
        }

        .status {
            font-weight: bold;
            font-size: 15px;
            margin-top: 10px;
            color: #555;
            min-height: 45px;
        }

        .ac-control {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
        }

        .ac-control button {
            background: #007bff;
            color: white;
            border: none;
            padding: 8px 14px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .ac-control button:hover {
            background: #0056b3;
        }

        .temp-display {
            font-size: 22px;
            font-weight: bold;
            color: #333;
            min-width: 60px;
        }

        .greeting {
            font-size: 16px;
            color: #007bff;
            margin-bottom: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Bagian Login -->
    <div class="login-box" id="loginSection">
        <h2>Masuk Simulasi</h2>
        <p>Masukkan nama Anda untuk mulai:</p>
        <input type="text" id="usernameInput" placeholder="Nama Anda..." autocomplete="off">
        <br>
        <button onclick="handleLogin()">Masuk</button>
    </div>

    <!-- Bagian Simulasi AC -->
    <div class="simulation-box" id="simulationSection">
        <h2>Simulasi Suhu AC</h2>
        <div class="greeting" id="greetingText"></div>
        
        <div class="room" id="roomBg">
            <div class="person" id="personEmoji">😊</div>
            <div class="status" id="statusText">Suhu ruangan nyaman.</div>
        </div>

        <div>
            <label>Suhu AC:</label>
            <div class="ac-control">
                <button onclick="changeTemp(-1)">-</button>
                <span class="temp-display" id="tempDisplay">24°C</span>
                <button onclick="changeTemp(1)">+</button>
            </div>
        </div>
    </div>
</div>

<script>
    let currentTemp = 24;
    const minTemp = 16;
    const maxTemp = 30;

    const loginSection = document.getElementById('loginSection');
    const simulationSection = document.getElementById('simulationSection');
    const usernameInput = document.getElementById('usernameInput');
    const greetingText = document.getElementById('greetingText');

    const personEmoji = document.getElementById('personEmoji');
    const statusText = document.getElementById('statusText');
    const tempDisplay = document.getElementById('tempDisplay');
    const roomBg = document.getElementById('roomBg');

    function handleLogin() {
        const name = usernameInput.value.trim();
        if (name === "") {
            alert("Silakan masukkan nama Anda terlebih dahulu!");
            return;
        }

        // Sembunyikan form login, tampilkan area simulasi
        loginSection.style.display = 'none';
        simulationSection.style.display = 'block';

        // Tampilkan sapaan dengan nama pengguna
        greetingText.innerText = `Halo, ${name}! Atur suhu AC sesuai kenyamananmu.`;
    }

    function changeTemp(amount) {
        currentTemp += amount;
        if (currentTemp < minTemp) currentTemp = minTemp;
        if (currentTemp > maxTemp) currentTemp = maxTemp;
        
        updateSimulation();
    }

    function updateSimulation() {
        tempDisplay.innerText = currentTemp + '°C';
        personEmoji.classList.remove('shivering');

        if (currentTemp >= 27) {
            personEmoji.innerText = '🥵';
            statusText.innerText = 'Suhu panas! Karakter merasa gerah dan berkeringat.';
            roomBg.style.background = '#ffebee';
        } else if (currentTemp >= 22 && currentTemp <= 26) {
            personEmoji.innerText = '😊';
            statusText.innerText = 'Suhu ruangan nyaman dan sejuk. Karakter merasa santai.';
            roomBg.style.background = '#eef2f3';
        } else if (currentTemp >= 19 && currentTemp <= 21) {
            personEmoji.innerText = '🥶';
            statusText.innerText = 'Mulai dingin! Karakter merasa kedinginan.';
            roomBg.style.background = '#e3f2fd';
        } else {
            personEmoji.innerText = '🥶';
            personEmoji.classList.add('shivering');
            statusText.innerText = 'Sangat dingin! Karakter menggigil kedinginan!';
            roomBg.style.background = '#bbdefb';
        }
    }
</script>

</body>
</html>
