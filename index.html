<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Validasi Nama Rekening & E-Wallet</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 420px;
        }
        h2 {
            margin-bottom: 5px;
            color: #1a1a1a;
            text-align: center;
        }
        p.subtitle {
            text-align: center;
            color: #666;
            font-size: 13px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #444;
            font-size: 14px;
        }
        select, input {
            width: 100%;
            padding: 12px;
            border: 1px solid #dcdcdc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        select:focus, input:focus {
            border-color: #0066cc;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0066cc;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #004fb3;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            font-size: 14px;
        }
        .success {
            background-color: #e6f4ea;
            color: #137333;
            border: 1px solid #ceead6;
        }
        .error {
            background-color: #fce8e6;
            color: #c5221f;
            border: 1px solid #fad2cf;
        }
        .loading {
            text-align: center;
            color: #666;
            font-style: italic;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Cek Pemilik Rekening</h2>
        <p class="subtitle">Validasi otomatis Bank & E-Wallet</p>
        
        <div class="form-group">
            <label for="bankCode">Pilih Bank / E-Wallet:</label>
            <select id="bankCode">
                <option value="dana">DANA</option>
                <option value="ovo">OVO</option>
                <option value="gopay">GoPay</option>
                <option value="bca">BCA</option>
                <option value="mandiri">Mandiri</option>
                <option value="bni">BNI</option>
                <option value="bri">BRI</option>
            </select>
        </div>

        <div class="form-group">
            <label for="accountNumber">Nomor Rekening / No. Handphone:</label>
            <input type="text" id="accountNumber" placeholder="Contoh: 08123456789 atau 12345678">
        </div>

        <button id="checkBtn" onclick="verifyAccount()">Periksa Rekening</button>

        <div id="loadingText" class="loading">Sedang memverifikasi ke server...</div>
        <div id="resultBox" class="result"></div>
    </div>

    <script>
        async function verifyAccount() {
            const bankCode = document.getElementById('bankCode').value;
            const accountNumber = document.getElementById('accountNumber').value.trim();
            const resultBox = document.getElementById('resultBox');
            const loadingText = document.getElementById('loadingText');
            const checkBtn = document.getElementById('checkBtn');

            if (!accountNumber) {
                alert('Nomor rekening atau nomor HP tidak boleh kosong!');
                return;
            }

            // Reset tampilan & aktifkan status loading
            resultBox.style.display = 'none';
            loadingText.style.display = 'block';
            checkBtn.disabled = true;

            try {
                // Contoh menggunakan endpoint publik/api checker pihak ketiga yang mendukung inquiry
                // Catatan: Anda bisa mengganti URL fetch ini dengan endpoint API backend Anda sendiri (seperti Xendit/Midtrans/API lokal)
                const response = await fetch(`https://api-rekening.cyclic.app/v1/inquiry?bank=${bankCode}&account=${accountNumber}`);
                const data = await response.json();

                loadingText.style.display = 'none';
                checkBtn.disabled = false;
                resultBox.style.display = 'block';

                // Logika pengecekan respon API
                if (data && (data.status === true || data.success === true || data.account_name)) {
                    let ownerName = data.account_name || data.data.account_name;
                    resultBox.className = 'result success';
                    resultBox.innerHTML = `<strong>Status: VALID</strong><br>Nama Pemilik: <b>${ownerName}</b>`;
                } else {
                    resultBox.className = 'result error';
                    resultBox.innerHTML = `<strong>Status: TIDAK VALID</strong><br>Nomor tidak ditemukan atau salah ketik.`;
                }

            } catch (error) {
                loadingText.style.display = 'none';
                checkBtn.disabled = false;
                resultBox.style.display = 'block';
                
                // Fallback jika API publik sedang limit/maintenance, arahkan menggunakan backend pribadi
                resultBox.className = 'result error';
                resultBox.innerHTML = `<strong>Gagal Terhubung</strong><br>Pastikan koneksi internet stabil atau gunakan API key pribadi (Midtrans/Xendit).`;
            }
        }
    </script>

</body>
</html>
