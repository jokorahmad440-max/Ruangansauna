<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Rekening & Screenshot Hasil</title>
    <!-- Memuat library html2canvas dari CDN untuk fitur SS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
        }
        /* Area yang akan di-screenshot */
        #captureArea {
            background: #ffffff;
            padding: 10px;
            border-radius: 6px;
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        select, input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .btn-ss {
            background-color: #28a745;
            display: none;
            margin-top: 10px;
        }
        .btn-ss:hover {
            background-color: #218838;
        }
        #result {
            margin-top: 15px;
            padding: 12px;
            border-radius: 4px;
            display: none;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .account-name {
            font-size: 16px;
            font-weight: bold;
            color: #0d6efd;
            margin-top: 5px;
        }
        .hint {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Area yang akan ditangkap gambarnya -->
    <div id="captureArea">
        <h2>Cek Rekening & Nama</h2>
        <form id="bankForm">
            <div class="form-group">
                <label for="bankSelect">Pilih Bank:</label>
                <select id="bankSelect" required>
                    <option value="">-- Pilih Bank --</option>
                    <option value="bca">BCA</option>
                    <option value="mandiri">Mandiri</option>
                    <option value="bri">BRI</option>
                    <option value="bni">BNI</option>
                    <option value="cimb">CIMB Niaga</option>
                    <option value="bsi">BSI (Bank Syariah Indonesia)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="accountNumber">Nomor Rekening:</label>
                <input type="text" id="accountNumber" placeholder="Masukkan nomor rekening" required>
                <div class="hint">Contoh BCA: <b>1234567890</b></div>
            </div>

            <button type="submit" id="submitBtn">Cek Rekening</button>
        </form>

        <div id="result"></div>
    </div>

    <!-- Tombol untuk Download Screenshot -->
    <button type="button" id="ssBtn" class="btn-ss" onclick="takeScreenshot()">Download Screenshot (SS)</button>
</div>

<script>
    const bankRules = {
      bca: { name: "BCA", minLength: 10, maxLength: 10 },
      mandiri: { name: "Mandiri", minLength: 13, maxLength: 13 },
      bri: { name: "BRI", minLength: 15, maxLength: 15 },
      bni: { name: "BNI", minLength: 10, maxLength: 10 },
      cimb: { name: "CIMB Niaga", minLength: 10, maxLength: 13 },
      bsi: { name: "BSI (Bank Syariah Indonesia)", minLength: 10, maxLength: 15 }
    };

    const bankForm = document.getElementById('bankForm');
    const bankSelect = document.getElementById('bankSelect');
    const accountNumberInput = document.getElementById('accountNumber');
    const resultDiv = document.getElementById('result');
    const submitBtn = document.getElementById('submitBtn');
    const ssBtn = document.getElementById('ssBtn');

    bankForm.addEventListener('submit', function(e) {
        e.preventDefault();

        const bankCode = bankSelect.value;
        const accountNumber = accountNumberInput.value.trim();

        if (!bankCode) {
            showResult(false, "Silakan pilih bank terlebih dahulu.");
            ssBtn.style.display = 'none';
            return;
        }

        if (!/^\d+$/.test(accountNumber)) {
            showResult(false, "Nomor rekening hanya boleh berisi angka.");
            ssBtn.style.display = 'none';
            return;
        }

        const bank = bankRules[bankCode];
        const length = accountNumber.length;
        if (length < bank.minLength || length > bank.maxLength) {
            showResult(false, `Nomor rekening ${bank.name} tidak valid. Panjang digit harus ${bank.minLength} angka.`);
            ssBtn.style.display = 'none';
            return;
        }

        submitBtn.textContent = "Mencari...";
        submitBtn.disabled = true;

        setTimeout(() => {
            submitBtn.textContent = "Cek Rekening";
            submitBtn.disabled = false;

            // Jika memasukkan BCA dan nomor 1234567890, munculkan nama SARIPUDIN
            if (bankCode === "bca" && accountNumber === "1234567890") {
                showResult(true, `
                    <div>Nomor Rekening Valid!</div>
                    <div class="account-name">Nama Pemilik: SARIPUDIN</div>
                `);
            } else {
                showResult(true, `
                    <div>Nomor Rekening Valid!</div>
                    <div class="account-name">Nama Pemilik: NASABAH ${bank.name}</div>
                `);
            }

            // Tampilkan tombol SS setelah pengecekan berhasil
            ssBtn.style.display = 'block';
        }, 800);
    });

    function showResult(isValid, htmlMessage) {
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = htmlMessage;
        resultDiv.className = isValid ? 'success' : 'error';
    }

    // Fungsi untuk mengambil Screenshot menggunakan html2canvas
    function takeScreenshot() {
        const captureElement = document.getElementById('captureArea');
        
        html2canvas(captureElement).then(canvas => {
            // Ubah canvas menjadi file gambar (PNG)
            const imageURL = canvas.toDataURL("image/png");
            
            // Buat elemen link virtual untuk mendownload gambar otomatis
            const downloadLink = document.createElement('a');
            downloadLink.href = imageURL;
            downloadLink.download = 'hasil-cek-rekening.png';
            
            // Jalankan klik link untuk mengunduh
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        });
    }
</script>

</body>
</html>
