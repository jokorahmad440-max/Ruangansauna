<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi Angin & Pohon</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(to bottom, #87CEEB, #E0F6FF);
            font-family: Arial, sans-serif;
            overflow: hidden;
            transition: background 0.5s ease;
        }

        /* Status Panas / Normal */
        body.hot {
            background: linear-gradient(to bottom, #ff9966, #ff5e62);
        }

        h1 {
            margin-bottom: 10px;
            color: #333;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.7);
        }

        #status {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: #222;
        }

        /* Arena Simulasi */
        .stage {
            position: relative;
            width: 400px;
            height: 300px;
            border-bottom: 5px solid #5c4033;
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            padding-bottom: 10px;
        }

        /* Pohon */
        .tree {
            font-size: 80px;
            transform-origin: bottom center;
            transition: transform 0.2s ease;
        }

        /* Efek Puting Beliung (Bergoyang Cepat & Liar) */
        .storm {
            animation: putingBeliung 0.15s infinite alternate ease-in-out;
        }

        @keyframes putingBeliung {
            0% { transform: rotate(-25deg) skewX(-15deg); }
            100% { transform: rotate(25deg) skewX(15deg); }
        }

        /* Efek Hancur / Tumbang */
        .destroyed {
            transform: rotate(90deg) translateY(20px);
            filter: grayscale(80%);
        }

        /* Kipas Angin */
        .fan {
            font-size: 60px;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s linear;
        }

        .fan.spinning {
            animation: spin 0.3s infinite linear;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Tombol Kontrol */
        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: background 0.2s;
        }

        button.active {
            background-color: #2ed573;
        }
    </style>
</head>
<body>

    <h1>Simulasi Kipas Angin & Pohon</h1>
    <div id="status">Kipas Mati: Pohon Hancur & Kepanasan!</div>

    <div class="stage">
        <!-- Pohon -->
        <div id="tree" class="tree destroyed">🌳</div>
        <!-- Kipas Angin -->
        <div id="fan" class="fan">🌀</div>
    </div>

    <button id="toggleBtn" onclick="toggleFan()">Hidupkan Kipas</button>

    <script>
        const fan = document.getElementById('fan');
        const tree = document.getElementById('tree');
        const toggleBtn = document.getElementById('toggleBtn');
        const statusText = document.getElementById('status');
        const body = document.body;

        let isFanOn = false;

        function toggleFan() {
            isFanOn = !isFanOn;

            if (isFanOn) {
                // Kipas Hidup -> Angin Puting Beliung
                fan.classList.add('spinning');
                tree.classList.remove('destroyed');
                tree.classList.add('storm');
                
                body.classList.remove('hot');
                toggleBtn.textContent = "Matikan Kipas";
                toggleBtn.classList.add('active');
                statusText.textContent = "Kipas Hidup: Terjadi Angin Puting Beliung!";
            } else {
                // Kipas Mati -> Hancur & Kepanasan
                fan.classList.remove('spinning');
                tree.classList.remove('storm');
                tree.classList.add('destroyed');
                
                body.classList.add('hot');
                toggleBtn.textContent = "Hidupkan Kipas";
                toggleBtn.classList.remove('active');
                statusText.textContent = "Kipas Mati: Pohon Hancur & Kepanasan!";
            }
        }
    </script>

</body>
</html>
