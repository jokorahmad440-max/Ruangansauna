<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validasi & Cek Nama Rekening Bank</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        select, input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result {
            margin-top: 15px;
            padding: 12px;
            border-radius: 4px;
            display: none;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .account-name {
            font-size: 16px;
            font-weight: bold;
            color: #0d6efd;
            margin-top: 5px;
        }
        .hint {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Cek Rekening & Nama</h2>
    <form id="bankForm">
        <div class="form-group">
            <label for="bankSelect">Pilih Bank:</label>
            <select id="bankSelect" required>
                <option value="">-- Pilih Bank --</option>
                <option value="bca">BCA</option>
                <option value="mandiri">Mandiri</option>
                <option value="bri">BRI</option>
                <option value="bni">BNI</option>
                <option value="cimb">CIMB Niaga</option>
                <option value="bsi">BSI (Bank Syariah Indonesia)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="accountNumber">Nomor Rekening:</label>
            <input type="text" id="accountNumber" placeholder="Masukkan nomor rekening" required>
            <div class="hint">Contoh BCA: <b>1234567890</b></div>
        </div>

        <button type="submit" id="submitBtn">Cek Rekening</button>
    </form>

    <div id="result"></div>
</div>

<script>
    const bankRules = {
      bca: { name: "BCA", minLength: 10, maxLength: 10 },
      mandiri: { name: "Mandiri", minLength: 13, maxLength: 13 },
      bri: { name: "BRI", minLength: 15, maxLength: 15 },
      bni: { name: "BNI", minLength: 10, maxLength: 10 },
      cimb: { name: "CIMB Niaga", minLength: 10, maxLength: 13 },
      bsi: { name: "BSI (Bank Syariah Indonesia)", minLength: 10, maxLength: 15 }
    };

    // Database tiruan untuk mencocokkan nomor rekening dan nama pemiliknya
    const mockDatabase = {
        "1234567890": { bank: "bca", name: "SARIPUDIN" },
        "1230009876543": { bank: "mandiri", name: "SITI AMINAH" },
        "034101000123501": { bank: "bri", name: "AHMAD FAUZI" },
    };

    const bankForm = document.getElementById('bankForm');
    const bankSelect = document.getElementById('bankSelect');
    const accountNumberInput = document.getElementById('accountNumber');
    const resultDiv = document.getElementById('result');
    const submitBtn = document.getElementById('submitBtn');

    bankForm.addEventListener('submit', function(e) {
        e.preventDefault();

        const bankCode = bankSelect.value;
        const accountNumber = accountNumberInput.value.trim();

        if (!bankCode) {
            showResult(false, "Silakan pilih bank terlebih dahulu.");
            return;
        }

        // Validasi angka
        if (!/^\d+$/.test(accountNumber)) {
            showResult(false, "Nomor rekening hanya boleh berisi angka.");
            return;
        }

        // Validasi panjang digit
        const bank = bankRules[bankCode];
        const length = accountNumber.length;
        if (length < bank.minLength || length > bank.maxLength) {
            showResult(false, `Nomor rekening ${bank.name} tidak valid. Panjang digit harus ${bank.minLength} angka.`);
            return;
        }

        // Simulasi proses pencarian ke server/API
        submitBtn.textContent = "Mencari...";
        submitBtn.disabled = true;

        setTimeout(() => {
            submitBtn.textContent = "Cek Rekening";
            submitBtn.disabled = false;

            // Cek apakah nomor rekening ada di database tiruan dan sesuai bank-nya
            const accountData = mockDatabase[accountNumber];

            if (accountData && accountData.bank === bankCode) {
                showResult(true, `
                    <div>Nomor Rekening Valid!</div>
                    <div class="account-name">Nama Pemilik: ${accountData.name}</div>
                `);
            } else if (bankCode === "bca" && accountNumber === "1234567890") {
                showResult(true, `
                    <div>Nomor Rekening Valid!</div>
                    <div class="account-name">Nama Pemilik: SARIPUDIN</div>
                `);
            } else {
                // Contoh default jika nomor rekening lain diinput
                showResult(true, `
                    <div>Nomor Rekening Valid!</div>
                    <div class="account-name">Nama Pemilik: NASABAH ${bank.name}</div>
                `);
            }
        }, 800);
    });

    function showResult(isValid, htmlMessage) {
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = htmlMessage;
        resultDiv.className = isValid ? 'success' : 'error';
    }
</script>

</body>
</html>
