<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi AC & Karakter Kartun</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #eef2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            text-align: center;
            width: 380px;
        }

        h2 {
            margin-bottom: 10px;
            color: #333;
        }

        /* Bagian Login */
        .login-box input[type="text"] {
            width: 80%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .login-box button {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-box button:hover {
            background: #218838;
        }

        .error-msg {
            color: #dc3545;
            font-size: 13px;
            margin-top: 5px;
            min-height: 18px;
        }

        /* Area Simulasi */
        .simulation-box {
            display: none;
        }

        .greeting {
            font-size: 14px;
            color: #007bff;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .room {
            background: #eef2f3;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
            transition: background 0.5s ease;
            height: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
        }

        /* Karakter Kartun SVG */
        .cartoon-character {
            width: 100px;
            height: 120px;
            transition: transform 0.3s ease;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-1px, -2px) rotate(-1deg); }
            40% { transform: translate(-3px, 0px) rotate(1deg); }
            60% { transform: translate(3px, 2px) rotate(0deg); }
            80% { transform: translate(1px, -1px) rotate(1deg); }
            100% { transform: translate(-1px, 2px) rotate(-1deg); }
        }

        .shivering {
            animation: shake 0.15s infinite;
        }

        .status {
            font-weight: bold;
            font-size: 13px;
            margin-top: 10px;
            color: #555;
            min-height: 35px;
        }

        /* Remote AC Fisik Styling */
        .remote {
            background: #333;
            border-radius: 15px;
            padding: 15px;
            color: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            margin-top: 10px;
        }

        .remote-screen {
            background: #111;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            padding: 8px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 12px;
            border: 2px solid #555;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .remote-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .remote-btn {
            background: #555;
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            font-size: 20px;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .remote-btn:hover {
            background: #777;
        }

        .remote-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Halaman Login -->
    <div class="login-box" id="loginSection">
        <h2>Simulasi AC Kartun</h2>
        <p>Masukkan nama Anda:</p>
        <input type="text" id="usernameInput" placeholder="Nama Anda..." autocomplete="off">
        <div class="error-msg" id="errorMsg"></div>
        <button onclick="handleLogin()">Masuk</button>
    </div>

    <!-- Halaman Simulasi -->
    <div class="simulation-box" id="simulationSection">
        <h2>Ruangan AC</h2>
        <div class="greeting" id="greetingText"></div>
        
        <div class="room" id="roomBg">
            <!-- Karakter Manusia Kartun SVG -->
            <svg class="cartoon-character" id="cartoonChar" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
                <rect id="bodyColor" x="30" y="65" width="40" height="45" rx="10" fill="#ff7675"/>
                <circle cx="50" cy="38" r="22" fill="#ffeaa7"/>
                <path d="M 28 35 Q 35 15 50 15 Q 65 15 72 35 Z" fill="#d63031"/>
                <g id="faceExpression">
                    <circle cx="42" cy="38" r="2.5" fill="#2d3436"/>
                    <circle cx="58" cy="38" r="2.5" fill="#2d3436"/>
                    <path d="M 44 48 Q 50 54 56 48" stroke="#2d3436" stroke-width="2" fill="none" stroke-linecap="round"/>
                </g>
            </svg>
            <div class="status" id="statusText">Suhu ruangan nyaman.</div>
        </div>

        <!-- Remote AC Simulasi -->
        <div class="remote">
            <div class="remote-screen">
               <span>AC: <span id="tempDisplay">24°C</span></span>
               <span id="modeIcon" style="font-size: 16px;">❄️ ON</span>
            </div>
            <div class="remote-buttons">
                <button class="remote-btn" onclick="changeTemp(-1)">-</button>
                <button class="remote-btn" onclick="changeTemp(1)">+</button>
            </div>
        </div>
    </div>
</div>

<script>
    let currentTemp = 24;
    const minTemp = 16;
    const maxTemp = 30;

    const loginSection = document.getElementById('loginSection');
    const simulationSection = document.getElementById('simulationSection');
    const usernameInput = document.getElementById('usernameInput');
    const errorMsg = document.getElementById('errorMsg');
    const greetingText = document.getElementById('greetingText');

    const cartoonChar = document.getElementById('cartoonChar');
    const bodyColor = document.getElementById('bodyColor');
    const faceExpression = document.getElementById('faceExpression');
    const statusText = document.getElementById('statusText');
    const tempDisplay = document.getElementById('tempDisplay');
    const modeIcon = document.getElementById('modeIcon');
    const roomBg = document.getElementById('roomBg');

    // Bisa tekan Enter langsung di keyboard
    usernameInput.addEventListener('keypress', function(event) {
        if (event.key === 'Enter') {
            handleLogin();
        }
    });

    function handleLogin() {
        const name = usernameInput.value.trim();
        if (name === "") {
            errorMsg.innerText = "Nama tidak boleh kosong!";
            usernameInput.focus();
            return;
        }

        errorMsg.innerText = "";
        loginSection.style.display = 'none';
        simulationSection.style.display = 'block';
        greetingText.innerText = `Halo, ${name}! Silakan atur suhu di remote AC bawah.`;
    }

    function changeTemp(amount) {
        currentTemp += amount;
        if (currentTemp < minTemp) currentTemp = minTemp;
        if (currentTemp > maxTemp) currentTemp = maxTemp;
        
        updateSimulation();
    }

    function updateSimulation() {
        tempDisplay.innerText = currentTemp + '°C';
        cartoonChar.classList.remove('shivering');

        if (currentTemp >= 27) {
            bodyColor.setAttribute("fill", "#ff7675");
            roomBg.style.background = '#ffebee';
            modeIcon.innerText = "🔥 HOT";
            statusText.innerText = "Uh, gerah banget! Karakter mulai berkeringat.";
            faceExpression.innerHTML = `
                <circle cx="42" cy="38" r="3" fill="#2d3436"/>
                <circle cx="58" cy="38" r="3" fill="#2d3436"/>
                <path d="M 43 52 Q 50 44 57 52" stroke="#2d3436" stroke-width="2" fill="none" stroke-linecap="round"/>
            `;
        } else if (currentTemp >= 22 && currentTemp <= 26) {
            bodyColor.setAttribute("fill", "#74b9ff");
            roomBg.style.background = '#eef2f3';
            modeIcon.innerText = "❄️ COOL";
            statusText.innerText = "Suhu sejuk dan pas. Karakter merasa santai.";
            faceExpression.innerHTML = `
                <circle cx="42" cy="38" r="2.5" fill="#2d3436"/>
                <circle cx="58" cy="38" r="2.5" fill="#2d3436"/>
                <path d="M 44 48 Q 50 54 56 48" stroke="#2d3436" stroke-width="2" fill="none" stroke-linecap="round"/>
            `;
        } else if (currentTemp >= 19 && currentTemp <= 21) {
            bodyColor.setAttribute("fill", "#0984e3");
            roomBg.style.background = '#e3f2fd';
            modeIcon.innerText = "❄️ CHILL";
            statusText.innerText = "Mulai dingin, karakter merapatkan bajunya.";
            faceExpression.innerHTML = `
                <circle cx="42" cy="38" r="2.5" fill="#2d3436"/>
                <circle cx="58" cy="38" r="2.5" fill="#2d3436"/>
                <circle cx="50" cy="50" r="3" fill="#2d3436"/>
            `;
        } else {
            bodyColor.setAttribute("fill", "#0984e3");
            roomBg.style.background = '#bbdefb';
            modeIcon.innerText = "🥶 FREEZE";
            cartoonChar.classList.add('shivering');
            statusText.innerText = "Brrr... Sangat dingin! Karakter menggigil kedinginan!";
            faceExpression.innerHTML = `
                <line x1="40" y1="37" x2="44" y2="39" stroke="#2d3436" stroke-width="2"/>
                <line x1="56" y1="37" x2="60" y2="39" stroke="#2d3436" stroke-width="2"/>
                <line x1="43" y1="50" x2="57" y2="50" stroke="#2d3436" stroke-width="2"/>
            `;
        }
    }
</script>

</body>
</html>
