<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Harta Karun</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 15px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
        }
        h2 {
            margin-bottom: 25px;
            color: #f1c40f;
            letter-spacing: 1px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #ddd;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #444;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }
        input:focus {
            border-color: #f1c40f;
            box-shadow: 0 0 8px rgba(241, 196, 15, 0.3);
        }
        button {
            width: 100%;
            padding: 12px;
            background: #f1c40f;
            border: none;
            color: #0f2027;
            font-weight: bold;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        button:hover {
            background: #d4ac0d;
        }
        .error-msg {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 10px;
        }
        .dashboard {
            display: none;
            text-align: left;
        }
        .card-info {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #f1c40f;
        }
        .card-info p {
            margin-bottom: 8px;
            font-size: 14px;
        }
        .card-info p:last-child {
            margin-bottom: 0;
        }
        .balance {
            font-size: 24px;
            color: #2ecc71;
            font-weight: bold;
            margin: 10px 0;
        }
        .action-btns {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .action-btns button {
            margin-top: 0;
            font-size: 14px;
            padding: 10px;
        }
        .btn-red {
            background: #e74c3c !important;
            color: #fff !important;
        }
        .btn-red:hover {
            background: #c0392b !important;
        }
        .blocked {
            display: none;
            color: #e74c3c;
        }
        .blocked h2 {
            color: #e74c3c;
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <!-- FORM LOGIN -->
        <div id="loginSection">
            <h2>BANK HARTA KARUN</h2>
            <div class="form-group">
                <label>Masukkan Password</label>
                <input type="password" id="passwordInput" placeholder="Password">
            </div>
            <button onclick="handleLogin()">MASUK</button>
            <div id="errorMsg" class="error-msg"></div>
        </div>

        <!-- DASHBOARD AKUN -->
        <div id="dashboardSection" class="dashboard">
            <h2>DASHBOARD AKUN</h2>
            <div class="card-info">
                <p><strong>Nama Pemilik:</strong> JOKO RAHMADSYAH</p>
                <p><strong>Nomor Rekening:</strong> 888202601</p>
                <p>Saldo Tersedia:</p>
                <div class="balance" id="saldoDisplay">Rp 0</div>
            </div>

            <div class="form-group">
                <label>Nominal Transaksi (Rp)</label>
                <input type="number" id="nominalInput" placeholder="Masukkan jumlah">
            </div>

            <div class="action-btns">
                <button onclick="tambahSaldo()">Setor</button>
                <button onclick="tarikSaldo()" class="btn-red">Tarik</button>
            </div>
            
            <button onclick="handleLogout()" style="background: #7f8c8d; color: #fff; margin-top: 15px;">Kunci Akun</button>
        </div>

        <!-- HALAMAN TERBLOKIR -->
        <div id="blockedSection" class="blocked">
            <h2>AKUN TERBLOKIR</h2>
            <p>Anda telah salah memasukkan password sebanyak 3 kali. Demi keamanan, akses akun dikunci secara permanen.</p>
        </div>
    </div>

    <script>
        // Data Tersimpan Permanen menggunakan localStorage
        const CORRECT_PASSWORD = "12345";
        let attempts = parseInt(localStorage.getItem('bank_attempts')) || 0;
        let isBlocked = localStorage.getItem('bank_blocked') === 'true';
        let isLoggedIn = localStorage.getItem('bank_logged_in') === 'true';
        let saldo = parseFloat(localStorage.getItem('bank_saldo')) || 1000000; // Saldo awal default Rp 1.000.000

        const loginSection = document.getElementById('loginSection');
        const dashboardSection = document.getElementById('dashboardSection');
        const blockedSection = document.getElementById('blockedSection');
        const errorMsg = document.getElementById('errorMsg');
        const saldoDisplay = document.getElementById('saldoDisplay');

        // Inisialisasi Tampilan Berdasarkan Status Sesi
        function initApp() {
            saldoDisplay.innerText = formatRupiah(saldo);

            if (isBlocked) {
                loginSection.style.display = 'none';
                dashboardSection.style.display = 'none';
                blockedSection.style.display = 'block';
            } else if (isLoggedIn) {
                loginSection.style.display = 'none';
                dashboardSection.style.display = 'block';
                blockedSection.style.display = 'none';
            } else {
                loginSection.style.display = 'block';
                dashboardSection.style.display = 'none';
                blockedSection.style.display = 'none';
            }
        }

        function handleLogin() {
            const pass = document.getElementById('passwordInput').value;

            if (pass === CORRECT_PASSWORD) {
                isLoggedIn = true;
                attempts = 0;
                localStorage.setItem('bank_logged_in', 'true');
                localStorage.setItem('bank_attempts', attempts);
                initApp();
            } else {
                attempts++;
                localStorage.setItem('bank_attempts', attempts);
                
                if (attempts >= 3) {
                    isBlocked = true;
                    localStorage.setItem('bank_blocked', 'true');
                    initApp();
                } else {
                    errorMsg.innerText = `Password salah! Sisa kesempatan: ${3 - attempts}`;
                }
            }
        }

        function tambahSaldo() {
            const nominal = parseFloat(document.getElementById('nominalInput').value);
            if (isNaN(nominal) || nominal <= 0) {
                alert("Masukkan nominal yang valid!");
                return;
            }
            saldo += nominal;
            localStorage.setItem('bank_saldo', saldo);
            saldoDisplay.innerText = formatRupiah(saldo);
            document.getElementById('nominalInput').value = '';
            alert("Setor tunai berhasil!");
        }

        function tarikSaldo() {
            const nominal = parseFloat(document.getElementById('nominalInput').value);
            if (isNaN(nominal) || nominal <= 0) {
                alert("Masukkan nominal yang valid!");
                return;
            }
            if (nominal > saldo) {
                alert("Saldo tidak mencukupi!");
                return;
            }
            saldo -= nominal;
            localStorage.setItem('bank_saldo', saldo);
            saldoDisplay.innerText = formatRupiah(saldo);
            document.getElementById('nominalInput').value = '';
            alert("Penarikan berhasil!");
        }

        function handleLogout() {
            isLoggedIn = false;
            localStorage.setItem('bank_logged_in', 'false');
            document.getElementById('passwordInput').value = '';
            initApp();
        }

        function formatRupiah(angka) {
            return 'Rp ' + angka.toLocaleString('id-ID');
        }

        // MATIKAN TOMBOL F12, INSPECT ELEMENT, DAN SHORTCUT DEVTOOLS
        document.addEventListener('keydown', function (e) {
            // F12
            if (e.keyCode === 123) {
                e.preventDefault();
                return false;
            }
            // Ctrl+Shift+I / Ctrl+Shift+J / Ctrl+Shift+C / Ctrl+U
            if (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) {
                e.preventDefault();
                return false;
            }
            if (e.ctrlKey && e.keyCode === 85) {
                e.preventDefault();
                return false;
            }
        });

        // Matikan Klik Kanan
        document.addEventListener('contextmenu', function (e) {
            e.preventDefault();
        });

        // Jalankan saat halaman dimuat
        window.onload = initApp;
    </script>
</body>
</html>
